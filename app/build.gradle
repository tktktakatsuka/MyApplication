// local.propertiesファイルを読み込むための準備


plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // Crashlyticsプラグイン
}

android {
    Properties properties = new Properties()
    if (rootProject.file("local.properties").exists()) {
        properties.load(rootProject.file("local.properties").newDataInputStream())
    }
    namespace 'com.tktkcompany.kakoRaceKeiba'
    compileSdk 36
    defaultConfig {
        targetSdkVersion 36
    }

    defaultConfig {
        applicationId "com.tktkcompany.kakoRaceKeiba"
        minSdk 24
        targetSdk 36
        versionCode 331
        versionName "1.0"
        // BuildConfigフィールドとしてAPIキーを定義
        buildConfigField "String", "GEMINI_API_KEY", properties.getProperty("GEMINI_API_KEY", "")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true

    }

    sourceSets {
        // それぞれのビルドタイプごとに異なるAndroidManifest.xmlを使用する
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // Retrofit (HTTP通信ライブラリ)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // OkHttp (Retrofitの内部で使われる。Logging Interceptorで通信内容をログ出力するのに便利)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.google.firebase:firebase-messaging:23.1.2'
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.threetenabp
    implementation libs.jsoup
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.firebase.crashlytics
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation libs.annotation // 最新版を使用
    implementation 'com.google.firebase:firebase-database:20.3.2'
    implementation 'com.google.firebase:firebase-analytics:21.6.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}