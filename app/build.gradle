// local.propertiesファイルを読み込むための準備


plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // Crashlyticsプラグイン
}

android {
    Properties properties = new Properties()
    if (rootProject.file("local.properties").exists()) {
        properties.load(rootProject.file("local.properties").newDataInputStream())
    }
    namespace 'com.tktkcompany.kakoRaceKeiba'
    compileSdk 36
    defaultConfig {
        targetSdkVersion 36
    }

    defaultConfig {
        applicationId "com.tktkcompany.kakoRaceKeiba"
        minSdk 28
        targetSdk 36
        versionCode 364
        versionName "1.0"
        // BuildConfigフィールドとしてAPIキーを定義
        buildConfigField "String", "GEMINI_API_KEY", properties.getProperty("GEMINI_API_KEY", "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        // それぞれのビルドタイプごとに異なるAndroidManifest.xmlを使用する
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // Retrofit (HTTP通信ライブラリ)
    implementation libs.retrofit
    implementation libs.converter.gson
    // OkHttp (Retrofitの内部で使われる。Logging Interceptorで通信内容をログ出力するのに便利)
    implementation libs.logging.interceptor
    implementation libs.firebase.messaging
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.threetenabp
    implementation libs.jsoup
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.firebase.crashlytics
    implementation libs.firebase.auth
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.play.services.ads.v2450
    implementation libs.annotation // 最新版を使用
    implementation libs.firebase.database
    implementation libs.google.firebase.analytics
    implementation libs.mpandroidchart
    implementation libs.firebase.auth
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid
    // Firebase Authentication
    implementation libs.firebase.auth.v2300

    // Google Identity Services (Credential Manager)
    implementation libs.credentials.v130
    implementation libs.credentials.play.services.auth.v130
    implementation libs.googleid
    implementation libs.play.services.ads.v2330

    // Google Sign-In fallback 用
    implementation libs.play.services.auth
}