// local.propertiesファイルを読み込むための準備


plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // Crashlyticsプラグイン
}

android {
    Properties properties = new Properties()
    if (rootProject.file("local.properties").exists()) {
        properties.load(rootProject.file("local.properties").newDataInputStream())
    }
    namespace = 'com.tktkcompany.kakoRaceKeiba'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.tktkcompany.kakoRaceKeiba"
        minSdk = 28
        targetSdk = 35
        versionCode = 374
        versionName = "1.0"
        // BuildConfigフィールドとしてAPIキーを定義
        buildConfigField "String", "GEMINI_API_KEY", properties.getProperty("GEMINI_API_KEY", "")
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        // それぞれのビルドタイプごとに異なるAndroidManifest.xmlを使用する
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // Firebase (BOMを使用)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.auth
    implementation libs.firebase.messaging
    implementation libs.firebase.database

    // Google Identity & Ads
    implementation libs.googleid
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.play.services.auth
    implementation libs.play.services.ads.v2450
    implementation libs.play.app.update
    implementation libs.play.review

    // AndroidX & UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.androidx.activity
    implementation libs.work.runtime

    // Network & Utils
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor
    implementation libs.threetenabp
    implementation libs.jsoup
    implementation libs.mpandroidchart
    implementation libs.annotation

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}